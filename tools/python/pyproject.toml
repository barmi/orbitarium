[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbitarium-tools"
version = "0.1.0"
description = "Python tooling, reference implementations, and validation utilities for the Orbitarium solar system simulator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "skshin" }]
keywords = ["astronomy", "ephemeris", "spice", "horizons", "solar-system"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
]

# Extras are added per-Work as needed (see docs/plan/overview.md §8).
[project.optional-dependencies]
astro = [
    "astropy>=6.0",
    "astroquery>=0.4.7",
    "spiceypy>=6.0",
    "jplephem>=2.21",
]
viz = [
    "matplotlib>=3.8",
    "scipy>=1.12",
]
notebook = [
    "jupyter",
    "ipykernel",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
all = [
    "orbitarium-tools[astro,viz,notebook,dev]",
]

[project.scripts]
orbitarium-tools = "orbitarium_tools.cli:main"

[project.urls]
Homepage = "https://github.com/skshin/orbitarium"

[tool.hatch.build.targets.wheel]
packages = ["src/orbitarium_tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
